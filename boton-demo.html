<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACA · Prueba del botón negro y oro</title><link rel="stylesheet" href="premium.css?v=2"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0c0d10;color:#e9d7ad;font:16px system-ui;display:grid;place-items:center;padding:24px}.card{width:min(720px,100%);text-align:center;padding:48px 30px;background:#111315;border:1px solid #302a1f;border-radius:24px}h1{font-size:24px;margin:0 0 12px}p{color:#bdb7a9;line-height:1.6}#sample{display:block;margin:48px auto 35px;width:min(480px,95%);min-height:100px;font-size:25px;letter-spacing:2px;border-width:3px;border-radius:24px}input[type=text]{width:min(400px,100%);padding:15px;margin:10px auto 25px}label{display:block;margin:20px}input[type=checkbox]{accent-color:#eac776;width:20px;height:20px;vertical-align:middle}#hold:checked~#sample{transform:translateY(6px);box-shadow:inset 0 3px 8px #000,0 1px 0 #151617,0 2px 0 #bd9445,0 3px 0 #4d3817,0 5px 5px #0009;filter:brightness(.94)}#hold{position:absolute;left:-9999px}.controls{display:flex;gap:15px;justify-content:center;align-items:center}.controls label{padding:12px;border:1px solid #66512c;border-radius:8px;cursor:pointer}.note{font-size:13px}a{color:#ebcc81}#state{min-height:30px;color:#ebcf8b}.card button:active{transform:translateY(5px)}</style><section class="card"><h1>Negro y filo de oro pulido</h1><p>Toca y mantén el botón: baja al pulsarlo y vuelve al soltarlo.</p><input type="checkbox" id="hold"><button id="sample">DIBUJO TÉCNICO</button><div id="state">Relieve · reflejos en el filo dorado</div><div class="controls"><label for="hold">Comparar posición pulsada</label></div><label for="project">Prueba de escritura</label><input id="project" type="text" placeholder="Nombre de tu proyecto" autocomplete="off"><p class="note">En iPhone y iPad, toca el campo para abrir el teclado original del dispositivo.</p><a href="./?revision=oro2">Volver a la aplicación</a></section></html>
